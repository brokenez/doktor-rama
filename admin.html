<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Админка — Доктор Рама</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#0f172a; color:#e2e8f0; font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    [hidden] { display:none !important; }
    button,input,textarea,select { font:inherit; }
    button,a { touch-action:manipulation; }
    button { cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible { outline:3px solid #f0c040; outline-offset:3px; }
    a { color:#f0c040; }
    .login { min-height:100svh; display:grid; place-items:center; padding:20px; }
    .login-box { width:100%; max-width:420px; padding:32px; border:1px solid #334155; border-radius:12px; background:#1e293b; }
    h1,h2,h3,p { margin-top:0; }
    .login-box h1 { font-size:24px; color:#f0c040; }
    .muted,.hint { color:#94a3b8; }
    .hint { display:block; margin-top:6px; font-size:13px; }
    .button { min-height:44px; padding:10px 18px; border:1px solid #475569; border-radius:8px; color:#e2e8f0; background:#334155; }
    .primary { background:#f0c040; border-color:#f0c040; color:#0f172a; font-weight:700; }
    .login-box .primary { width:100%; margin-top:16px; }
    .danger { color:#fca5a5; background:transparent; }
    .error { color:#fca5a5; white-space:pre-line; margin:10px 0 0; }
    .error:empty { display:none; }
    header { min-height:64px; position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:8px 24px; border-bottom:1px solid #334155; background:#1e293b; }
    .brand { font-weight:700; color:#f0c040; }
    .header-actions { display:flex; align-items:center; gap:16px; flex-shrink:0; }
    .header-actions a { display:flex; align-items:center; min-height:44px; white-space:nowrap; text-decoration:none; }
    .layout { display:flex; align-items:flex-start; }
    aside { width:240px; flex-shrink:0; position:sticky; top:64px; max-height:calc(100svh - 64px); overflow:auto; padding:16px 12px; }
    .nav-button { display:block; width:100%; min-height:44px; padding:10px 12px; text-align:left; color:#cbd5e1; background:transparent; border:0; border-left:3px solid transparent; border-radius:4px; }
    .nav-button[aria-current="page"] { background:#1e293b; color:#f0c040; border-left-color:#f0c040; }
    .mobile-navigation { display:none; }
    main { flex:1; min-width:0; max-width:1080px; padding:28px 32px 48px; }
    main h1 { font-size:26px; }
    .card { border:1px solid #334155; border-radius:12px; padding:24px; margin-bottom:20px; background:#1e293b; }
    .card h2 { color:#f0c040; font-size:18px; }
    .field { display:block; margin-bottom:18px; min-width:0; }
    .field:last-child { margin-bottom:0; }
    .field-label { display:block; margin-bottom:7px; color:#cbd5e1; font-size:14px; }
    input,textarea,select { width:100%; min-height:44px; padding:10px 12px; border:1px solid #475569; border-radius:8px; background:#0f172a; color:#e2e8f0; }
    textarea { min-height:110px; resize:vertical; }
    input[type="checkbox"] { width:22px; min-height:22px; margin:0 10px 0 0; vertical-align:middle; accent-color:#f0c040; }
    input[type="file"] { max-width:100%; font-size:14px; }
    .item { border:1px solid #334155; background:#0f172a; border-radius:10px; margin-bottom:16px; padding:20px; }
    .item-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:18px; }
    .item-header h3 { margin:0; font-size:16px; }
    .item-actions { display:flex; gap:6px; }
    .item-actions button { min-width:44px; padding:8px; }
    .image-preview { display:block; max-width:100%; max-height:220px; object-fit:contain; margin:10px 0; border-radius:8px; }
    .image-actions { display:grid; gap:8px; }
    .image-actions .button { justify-self:start; }
    .save-panel { position:sticky; bottom:0; border:1px solid #475569; border-radius:12px; background:#1e293b; padding:16px; box-shadow:0 -8px 24px #0f172a66; }
    .save-panel .primary { width:100%; }
    #save-status { margin:10px 0 0; color:#a7f3d0; }
    #dirty-status { margin-bottom:12px; color:#cbd5e1; font-size:14px; }
    @media (max-width:768px) {
      header { padding:8px 16px; gap:10px; }
      .brand { font-size:15px; max-width:150px; }
      .header-actions { gap:10px; font-size:13px; }
      .header-actions .button { padding:8px 10px; }
      .layout { display:block; }
      aside { position:sticky; top:64px; z-index:9; width:100%; max-height:none; padding:10px 16px; background:#1e293b; border-bottom:1px solid #334155; }
      .nav-list { display:none; }
      .mobile-navigation { display:block; }
      .mobile-navigation label { display:block; font-size:12px; color:#cbd5e1; margin-bottom:4px; }
      main { padding:22px 16px 32px; }
      main h1 { font-size:24px; }
      .card { padding:18px; }
      .item { padding:16px; }
      .save-panel { bottom:env(safe-area-inset-bottom,0); }
    }
  </style>
</head>
<body>
  <section id="login-screen" class="login">
    <form id="login-form" class="login-box">
      <h1>Доктор Рама</h1><p class="muted">Панель управления сайтом</p>
      <label class="field" for="password-input"><span class="field-label">Пароль</span><input id="password-input" type="password" autocomplete="current-password" required></label>
      <button id="login-button" class="button primary" type="submit">Войти</button><p id="login-error" class="error" role="alert"></p>
    </form>
  </section>
  <div id="admin-screen" hidden>
    <header><div class="brand">Доктор Рама — Админка</div><div class="header-actions"><a href="/" target="_blank" rel="noopener">На сайт ↗</a><button id="logout-button" class="button" type="button">Выйти</button></div></header>
    <div class="layout">
      <aside aria-label="Разделы сайта">
        <nav id="section-navigation" class="nav-list" aria-label="Разделы контента"></nav>
        <div class="mobile-navigation"><label for="section-select">Раздел сайта</label><select id="section-select" aria-label="Раздел сайта"></select></div>
      </aside>
      <main><h1 id="page-title"></h1>
        <form id="editor"><div id="editor-fields"></div>
          <div class="save-panel"><p id="dirty-status">Изменений нет</p><button class="button primary" id="save-button" type="submit">Сохранить изменения</button><p id="save-status" role="status"></p><p id="save-error" class="error" role="alert"></p></div>
        </form>
      </main>
    </div>
  </div>
  <script src="/content-schema.js"></script><script src="/site-content.js"></script><script src="/admin.js"></script>
</body>
</html>
